<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Marché aux Guerriers</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Guerriers">
<meta name="theme-color" content="#E4E7E9">
<style>
:root{
  --paper:#E4E7E9; --ink:#15181B; --ink-2:#5A6168;
  --a:#9E2B25; --a-soft:#F0D9D7;
  --b:#275E7F; --b-soft:#D4E2EA;
  --dead:#AEB4B9; --line:#C3C9CD;
  --go:#1A6B41; --warn:#8A5A00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--paper); color:var(--ink);
  font:500 17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  display:flex; flex-direction:column; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- barre d'état ---------- */
#bar{
  flex:0 0 auto; display:flex; align-items:stretch; gap:1px;
  background:var(--line); border-bottom:1px solid var(--line);
}
#bar>*{background:var(--paper);display:flex;align-items:center;justify-content:center}
#tour{flex:1;flex-direction:column;padding:8px 4px;line-height:1.1}
#tour b{font-size:26px;font-variant-numeric:tabular-nums}
#tour span{font-size:12px;color:var(--ink-2)}
.pts{flex:0 0 68px;flex-direction:column;color:#fff;padding:8px 0;line-height:1.05}
.pts.a{background:var(--a)} .pts.b{background:var(--b)}
.pts b{font-size:30px;font-variant-numeric:tabular-nums}
.pts span{font-size:11px;opacity:.85;max-width:62px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#undo{flex:0 0 58px;font-size:22px;color:var(--ink-2)}
#undo:disabled{opacity:.25}

/* ---------- zone centrale ---------- */
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 4px}
h2{margin:0 0 4px;font-size:19px;font-weight:700}
.hint{margin:0 0 14px;font-size:14px;color:var(--ink-2);line-height:1.4}

/* ---------- jetons ---------- */
.grid{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  min-height:56px;padding:8px 14px;border-radius:10px;
  background:#fff;border:2px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  font-size:16px;font-weight:600;flex:1 1 auto;min-width:118px;max-width:100%;
}
.chip small{font-size:11px;font-weight:500;color:var(--ink-2);margin-top:2px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on small{color:#C9CDD1}
.chip.a{background:var(--a-soft);border-color:var(--a);color:var(--a)}
.chip.b{background:var(--b-soft);border-color:var(--b);color:var(--b)}
.chip.mort{background:#fff;border-color:var(--line);border-style:dashed;color:var(--dead)}
.chip.mort small{color:var(--dead)}
.chip.vivant{position:relative}
.chip.vivant::after{
  content:"";position:absolute;top:7px;right:9px;
  width:11px;height:11px;border-radius:50%;background:var(--go);
}
.chip.neuf{box-shadow:inset 0 -4px 0 var(--warn)}

/* ---------- terrain ---------- */
#terrain{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.camp{border-radius:12px;padding:8px;min-height:120px}
.camp.a{background:var(--a-soft);outline:2px solid var(--a)}
.camp.b{background:var(--b-soft);outline:2px solid var(--b)}
.camp h3{margin:0 0 7px;font-size:12px;font-weight:700;color:var(--ink-2)}
.camp .chip{min-width:0;width:100%;min-height:48px;font-size:15px;padding:6px 10px}
.camp .grid{flex-direction:column;gap:5px}
.vide{font-size:13px;color:var(--ink-2);padding:6px 2px}

/* ---------- barre d'action ---------- */
#act{
  flex:0 0 auto;display:flex;gap:7px;padding:9px 10px;max-width:100%;
  padding-left:calc(10px + env(safe-area-inset-left,0px));
  padding-right:calc(10px + env(safe-area-inset-right,0px));
  padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--paper);
}
.btn{
  flex:1 1 0;min-width:0;min-height:62px;border-radius:12px;font-size:18px;font-weight:700;
  background:var(--ink);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;line-height:1.15;padding:6px 8px;overflow:hidden
}
.btn>span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.mini{flex:0 0 54px;font-size:21px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.va{background:var(--a)} .btn.vb{background:var(--b)}
.btn.go{background:var(--go)}
.btn[disabled]{opacity:.3}
.btn small{display:block;font-size:12px;font-weight:500;opacity:.8;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- pavé numérique ---------- */
#pave{position:fixed;inset:0;background:rgba(21,24,27,.55);display:none;z-index:9;
  align-items:flex-end;padding-bottom:env(safe-area-inset-bottom,0px)}
#pave.open{display:flex}
#pave .box{background:var(--paper);width:100%;border-radius:16px 16px 0 0;padding:14px}
#pave .val{font-size:40px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;
  padding:6px 0 12px}
#pave .rapide{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#pave .rapide button{flex:1 0 58px;min-height:48px;border-radius:9px;background:#fff;
  border:2px solid var(--line);font-weight:700}
#pave .num{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#pave .num button{min-height:56px;border-radius:9px;background:#fff;border:2px solid var(--line);
  font-size:22px;font-weight:700}
#pave .num button.ok{background:var(--go);color:#fff;border-color:var(--go)}

table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:190px;font:inherit;padding:10px;border:2px solid var(--line);
  border-radius:10px;background:#fff;-webkit-user-select:auto;user-select:auto}
.pas{display:flex;gap:4px;margin-bottom:12px}
.pas i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.pas i.fait{background:var(--ink)}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .12s,border-color .12s}}
</style>
</head>
<body>

<div id="bar">
  <div class="pts a"><b id="sa">0</b><span id="na">A</span></div>
  <div id="tour"><b id="num">—</b><span id="sous">séance</span></div>
  <div class="pts b"><b id="sb">0</b><span id="nb">B</span></div>
  <button id="undo" title="Annuler">⟲</button>
</div>

<main id="vue"></main>
<div id="act"></div>

<div id="pave"><div class="box">
  <div class="val" id="paveVal">0</div>
  <div class="rapide" id="paveRapide"></div>
  <div class="num" id="paveNum"></div>
</div></div>

<script>
'use strict';
const CLE = 'mag.seance.v1';
const LOADOUTS = {eb:'épée+bouclier', hb:'hache 1M+bouclier', h2:'danoise', lb:'lance+bouclier', l2:'lance 2M'};

let S = charger() || neuf();

function neuf(){
  return {roster:[], presents:[], terrain:6, budget:140,
          eq:{}, role:{}, prix:{}, load:{},
          cap:[], protege:[], vivier:[],
          field:{}, joues:{}, assauts:[], enCours:false, phase:'roster', etape:0,
          debut:new Date().toISOString()};
}
function sauver(){ try{ localStorage.setItem(CLE, JSON.stringify(S)); }catch(e){} }
function charger(){ try{ return JSON.parse(localStorage.getItem(CLE)); }catch(e){ return null; } }
const nom = id => (S.roster.find(p=>p.id===id)||{}).nom || '?';
const $ = s => document.querySelector(s);

/* ------------------------------------------------ rendu général */
function rendre(){
  sauver();
  const a = S.assauts.filter(x=>x.v==='A').length;
  const b = S.assauts.filter(x=>x.v==='B').length;
  $('#sa').textContent=a; $('#sb').textContent=b;
  $('#undo').disabled = !S.assauts.length;
  let cap = S.cap.map(c=>nom(c).split(' ')[0]);
  // si les deux premiers mots sont identiques (« numéro 1 » / « numéro 2 »),
  // on affiche le nom complet plutôt que deux étiquettes jumelles
  if(cap[0] && cap[0]===cap[1]) cap = S.cap.map(c=>nom(c));
  $('#na').textContent = cap[0] || 'A';
  $('#nb').textContent = cap[1] || 'B';
  if(S.phase==='combat'){
    $('#num').textContent = S.assauts.length+1;
    $('#sous').textContent = 'assaut';
  } else {
    $('#num').textContent = S.presents.length || '—';
    $('#sous').textContent = S.phase==='roster' ? 'roster' : 'présents';
  }
  ({roster:vRoster, presents:vPresents, constitution:vConstitution,
    combat:vCombat, bilan:vBilan})[S.phase]();
}
function vue(html, actions){
  $('#vue').innerHTML = html;
  $('#act').innerHTML = '';
  (actions||[]).forEach(a=>{
    if(!a) return;
    const b=document.createElement('button');
    b.className='btn '+(a.cls||'');
    b.innerHTML = `<span>${a.t}</span>` + (a.s?`<small>${a.s}</small>`:'');
    if(a.off) b.disabled=true; else b.onclick=a.f;
    $('#act').appendChild(b);
  });
  $('#vue').scrollTop = 0;
}
function jetons(liste, opts){
  return `<div class="grid">${liste.map(p=>{
    const o = opts(p);
    return `<button class="chip ${o.cls||''}" data-id="${p.id}">${p.nom}${o.sub?`<small>${o.sub}</small>`:''}</button>`;
  }).join('')}</div>`;
}
function surJeton(f){
  $('#vue').querySelectorAll('.chip[data-id]').forEach(el=>{
    el.onclick = ()=> f(+el.dataset.id);
  });
}

/* ------------------------------------------------ 1. roster */
function vRoster(){
  vue(`<h2>Le roster du club</h2>
    <p class="hint">Un nom par ligne. Tu ne fais ça qu'une fois : il est conservé d'une séance à l'autre.</p>
    <textarea id="ta" placeholder="Kevin Durand&#10;Bruno Petit&#10;Marie Lambert">${S.roster.map(p=>p.nom).join('\n')}</textarea>`,
    [{t:'Enregistrer le roster', cls:'go', f:()=>{
      const l = $('#ta').value.split('\n').map(s=>s.trim()).filter(Boolean);
      S.roster = l.map((n,i)=>({id:i+1, nom:n}));
      if(!S.roster.length) return;
      S.phase='presents'; rendre();
    }}]);
}

/* ------------------------------------------------ 2. présents */
function vPresents(){
  const n = S.presents.length;
  const t = n>=20?6:5;
  vue(`<h2>Qui est là ?</h2>
    <p class="hint">${n} présents${n>=12?` · terrain ${t}v${t} · équipes de ${Math.floor(n/2)}`:' · il en faut 12 minimum'}</p>
    ${jetons(S.roster, p=>({cls: S.presents.includes(p.id)?'on':''}))}`,
    [{t:'Roster', cls:'ghost', f:()=>{S.phase='roster';rendre();}},
     {t:'Constituer les équipes', cls:'go', off:n<12, f:()=>{
       S.terrain=t; S.phase='constitution'; S.etape=0; rendre();}}]);
  surJeton(id=>{
    const i=S.presents.indexOf(id);
    if(i<0) S.presents.push(id); else S.presents.splice(i,1);
    rendre();
  });
}

/* ------------------------------------------------ 3. constitution */
const ETAPES = ['Capitaines','Protégés','Vivier','Tirage','Enchère'];
function vConstitution(){
  const pres = S.roster.filter(p=>S.presents.includes(p.id));
  const strip = `<div class="pas">${ETAPES.map((_,i)=>`<i class="${i<=S.etape?'fait':''}"></i>`).join('')}</div>`;
  const retour = {t:'Retour', cls:'ghost', f:()=>{
    // Revenir en arrière annule l'étape qu'on quitte, sinon les choix s'accumulent.
    if(S.etape===4){ S.vivier.forEach(id=>{ delete S.eq[id]; delete S.prix[id]; delete S.role[id]; }); S.etape=3; }
    else if(S.etape===3){ S.eq={}; S.role={}; S.etape=2; }
    else if(S.etape===2){ S.vivier=[]; S.etape=1; }
    else if(S.etape===1){ S.protege=[]; S.etape=0; }
    else { S.cap=[]; S.phase='presents'; }
    rendre();}};

  /* --- capitaines --- */
  if(S.etape===0){
    vue(strip+`<h2>Les deux capitaines</h2>
      <p class="hint">Rotation : ceux qui n'ont pas capitainé depuis le plus longtemps. Choisis-en deux.</p>
      ${jetons(pres, p=>({cls:S.cap.includes(p.id)?'on':''}))}`,
      [retour,{t:'Suite', cls:'go', off:S.cap.length!==2, f:()=>{S.etape=1;rendre();}}]);
    return surJeton(id=>{
      const i=S.cap.indexOf(id);
      if(i>=0) S.cap.splice(i,1); else if(S.cap.length<2) S.cap.push(id);
      rendre();
    });
  }

  /* --- protégés --- */
  if(S.etape===1){
    const pris = [...S.cap, ...S.protege.filter(Boolean)];
    const dispo = pres.filter(p=>!pris.includes(p.id));
    const qui = i => S.protege[i] ? nom(S.protege[i]) : 'aucun';
    vue(strip+`<h2>Les protégés</h2>
      <p class="hint">Chaque capitaine garde une personne d'office, avant le tirage.
      Tape un protégé déjà choisi pour le retirer.</p>
      <table>
        <tr><td style="color:var(--a);font-weight:700">${nom(S.cap[0])}</td><td>${qui(0)}</td></tr>
        <tr><td style="color:var(--b);font-weight:700">${nom(S.cap[1])}</td><td>${qui(1)}</td></tr>
      </table>
      ${S.protege.filter(Boolean).length ? `<h3 style="margin:16px 0 6px">Choisis</h3>
      ${jetons(S.roster.filter(p=>S.protege.includes(p.id)), p=>({
        cls: S.protege[0]===p.id ? 'a' : 'b'}))}` : ''}
      <h3 style="margin:16px 0 6px">Disponibles</h3>
      ${jetons(dispo, ()=>({}))}`,
      [retour,
       {t:'Sans protégé', cls:'ghost', f:()=>{S.protege=[];S.etape=2;rendre();}},
       {t:'Suite', cls:'go', f:()=>{S.etape=2;rendre();}}]);
    return surJeton(id=>{
      const i = S.protege.indexOf(id);
      if(i>=0){ S.protege[i]=null; }
      else if(!S.protege[0]){ S.protege[0]=id; }
      else if(!S.protege[1]){ S.protege[1]=id; }
      rendre();
    });
  }

  /* --- vivier --- */
  if(S.etape===2){
    const pris = [...S.cap, ...S.protege.filter(Boolean)];
    const dispo = pres.filter(p=>!pris.includes(p.id));
    vue(strip+`<h2>Le vivier · ${S.vivier.length}/8</h2>
      <p class="hint">Les agents libres, les seuls mis aux enchères. Volontaires la première fois ;
      ensuite les mieux classés.</p>
      ${jetons(dispo, p=>({cls:S.vivier.includes(p.id)?'on':''}))}`,
      [retour,{t:'Tirer au sort', s:`${dispo.length-S.vivier.length} restants`, cls:'go',
        off:!S.vivier.length, f:()=>{tirage(); S.etape=3; rendre();}}]);
    return surJeton(id=>{
      const i=S.vivier.indexOf(id);
      if(i>=0) S.vivier.splice(i,1); else if(S.vivier.length<8) S.vivier.push(id);
      rendre();
    });
  }

  /* --- tirage --- */
  if(S.etape===3){
    vue(strip+`<h2>Les deux bases</h2>
      <p class="hint">Annonce-les à voix haute, avec les armes. C'est ce qui rend l'enchère
      intéressante : chacun voit son trou et celui d'en face.</p>
      ${['A','B'].map(e=>`
        <h3 style="margin:14px 0 6px;color:var(--${e==='A'?'a':'b'})">Équipe ${nom(S.cap[e==='A'?0:1])}</h3>
        ${jetons(S.roster.filter(p=>S.eq[p.id]===e), p=>({
          cls:e.toLowerCase(), sub:S.role[p.id]+(S.load[p.id]?' · '+LOADOUTS[S.load[p.id]]:'')
        }))}`).join('')}`,
      [retour,
       {t:'Retirer', cls:'ghost', f:()=>{tirage();rendre();}},
       {t:'Enchère', cls:'go', f:()=>{S.etape=4;rendre();}}]);
    return surJeton(id=> cycleLoadout(id));
  }

  /* --- enchère --- */
  const reste = S.vivier.filter(id=>!S.eq[id]);
  const dep = e => S.vivier.filter(i=>S.eq[i]===e).reduce((s,i)=>s+(S.prix[i]||0),0);
  if(S.etape===4){
    vue(strip+`<h2>L'enchère</h2>
      <p class="hint">Nominer, c'est miser : ouverture au plancher, incrément 5, 10 secondes sans
      relance et c'est adjugé. Budget ${S.budget} pièces chacun.</p>
      <table><tr><th>Équipe</th><th class="n">Dépensé</th><th class="n">Reste</th><th class="n">Lots</th></tr>
      ${['A','B'].map(e=>`<tr><td style="color:var(--${e==='A'?'a':'b'});font-weight:700">${nom(S.cap[e==='A'?0:1])}</td>
        <td class="n">${dep(e)}</td><td class="n">${S.budget-dep(e)}</td>
        <td class="n">${S.vivier.filter(i=>S.eq[i]===e).length}/4</td></tr>`).join('')}</table>
      <h3 style="margin:16px 0 6px">À vendre · ${reste.length}</h3>
      ${reste.length ? jetons(S.roster.filter(p=>reste.includes(p.id)), ()=>({}))
                     : '<p class="hint">Tout est vendu.</p>'}
      <h3 style="margin:16px 0 6px">Adjugés</h3>
      ${jetons(S.roster.filter(p=>S.vivier.includes(p.id)&&S.eq[p.id]), p=>({
        cls:S.eq[p.id].toLowerCase(), sub:S.prix[p.id]+' pièces'}))}`,
      [retour,{t:'Commencer les assauts', cls:'go', off:reste.length>0,
        f:()=>{S.phase='combat';rendre();}}]);
    return surJeton(id=>{
      if(S.eq[id]){ delete S.eq[id]; delete S.prix[id]; delete S.role[id]; return rendre(); }
      acheter(id);
    });
  }
}

function tirage(){
  S.eq={}; S.role={};
  S.cap.forEach((c,i)=>{ S.eq[c]=i?'B':'A'; S.role[c]='capitaine'; });
  S.protege.forEach((p,i)=>{ if(p){ S.eq[p]=i?'B':'A'; S.role[p]='protege'; } });
  const reste = S.presents.filter(id=>!S.eq[id] && !S.vivier.includes(id));
  for(let i=reste.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [reste[i],reste[j]]=[reste[j],reste[i]]; }
  reste.forEach((id,i)=>{ S.eq[id]= i%2 ? 'B':'A'; S.role[id]='tirage'; });
}
function cycleLoadout(id){
  const k=Object.keys(LOADOUTS); const i=k.indexOf(S.load[id]);
  if(i>=k.length-1) delete S.load[id]; else S.load[id]=k[i+1];
  rendre();
}

/* ------------------------------------------------ pavé numérique */
let paveCb=null;
function pave(titre, cb){
  paveCb=cb; let v='';
  const maj = ()=> $('#paveVal').textContent = (v||'0')+' pièces';
  $('#paveRapide').innerHTML = [5,10,15,20,25,30,40,50,60,80].map(n=>`<button data-v="${n}">${n}</button>`).join('');
  $('#paveNum').innerHTML = [1,2,3,4,5,6,7,8,9,'C',0,'OK'].map(n=>
    `<button class="${n==='OK'?'ok':''}" data-k="${n}">${n}</button>`).join('');
  maj();
  $('#paveRapide').querySelectorAll('button').forEach(b=>b.onclick=()=>{ fin(+b.dataset.v); });
  $('#paveNum').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='C'){ v=''; } else if(k==='OK'){ if(v) fin(+v); } else if(v.length<4){ v+=k; }
    maj();
  });
  $('#pave').classList.add('open');
  $('#pave').onclick = e=>{ if(e.target.id==='pave') ferme(); };
}
function fin(n){ ferme(); paveCb && paveCb(n); }
function ferme(){ $('#pave').classList.remove('open'); }

function acheter(id){
  pave(nom(id), prixPaye=>{
    const choix = document.createElement('div');
    S._achat={id, prix:prixPaye};
    vueAchat();
  });
}
function vueAchat(){
  const {id,prix} = S._achat;
  vue(`<h2>${nom(id)} · ${prix} pièces</h2><p class="hint">Qui l'emporte ?</p>`,
    [{t:nom(S.cap[0]), cls:'va', f:()=>adjuger('A')},
     {t:nom(S.cap[1]), cls:'vb', f:()=>adjuger('B')},
     {t:'Annuler', cls:'ghost', f:()=>{delete S._achat;rendre();}}]);
}
function adjuger(e){
  const {id,prix}=S._achat;
  S.eq[id]=e; S.prix[id]=prix; S.role[id]='achat';
  delete S._achat; rendre();
}

/* ------------------------------------------------ 4. combat */
function camp(e){ return S.presents.filter(id=>S.eq[id]===e); }
function surTerrain(e){ return Object.keys(S.field).filter(id=>S.field[id]===e).map(Number); }
function banc(e){ return camp(e).filter(id=>!(id in S.field)); }
function plein(){ return ['A','B'].every(e=> surTerrain(e).length>=S.terrain || !banc(e).length); }
function prets(){ return surTerrain('A').length>0 && surTerrain('B').length>0; }

function vCombat(){
  const html = ['A','B'].map(e=>{
    const sur = surTerrain(e);
    const manque = S.terrain - sur.length;
    return `<div class="camp ${e.toLowerCase()}">
      <h3>${nom(S.cap[e==='A'?0:1])} · ${sur.length}${sur.length===S.terrain?'':' / '+S.terrain}</h3>
      ${sur.length ? jetons(sur.map(id=>({id,nom:nom(id)})), p=>({
          cls:(S.surv||[]).includes(p.id)?'vivant':'mort',
          sub:S.load[p.id]?LOADOUTS[S.load[p.id]]:''}))
        : '<p class="vide">personne</p>'}
      ${manque>0 ? `<p class="vide">${manque} à faire entrer</p>` : ''}
    </div>`;
  }).join('');

  if(!S.enCours){
    const bancs = ['A','B'].map(e=>{
      const b = banc(e).sort((x,y)=>(S.joues[x]||0)-(S.joues[y]||0) || nom(x).localeCompare(nom(y)));
      if(!b.length) return '';
      return `<h3 style="margin:14px 0 6px;color:var(--${e==='A'?'a':'b'})">Banc ${nom(S.cap[e==='A'?0:1])}</h3>
        ${jetons(b.map(id=>({id,nom:nom(id)})), p=>({
          cls:(S.joues[p.id]||0)===0?'neuf':'',
          sub:(S.joues[p.id]||0)+' assauts'}))}`;
    }).join('');
    const a = surTerrain('A').length, b = surTerrain('B').length;
    vue(`<div id="terrain">${html}</div>
      <p class="hint">Cible ${S.terrain} par camp, mais tu peux en mettre plus ou moins —
      les nombres inégaux sont permis. Trié par assauts joués, liseré orange : pas encore combattu.
      ${a&&b&&a!==b?`<br><b>${a} contre ${b}</b>`:''}</p>${bancs}`,
      [S.assauts.length ? null : {t:'Retour', cls:'ghost',
         f:()=>{S.field={};S.phase='constitution';S.etape=4;rendre();}},
       {t:'Compléter', s:'les moins joués', cls:'ghost', f:completer},
       {t:'Lancer', s:'l\'assaut', cls:'go', off:!prets(),
         f:()=>{S.enCours=true;S.surv=[];rendre();}}]);
    return surJeton(id=>{
      if(id in S.field){ delete S.field[id]; } else { S.field[id]=S.eq[id]; }
      rendre();
    });
  }

  S.surv = S.surv||[];
  const court = i => nom(S.cap[i]).split(' ')[0];
  vue(`<div id="terrain">${html}</div>
    <p class="hint">Tape ceux qui sont encore debout, puis le vainqueur.
    ${S.surv.length} survivant${S.surv.length>1?'s':''}.</p>`,
    [{t:'↩', cls:'ghost mini', f:()=>{S.enCours=false;S.surv=[];rendre();}},
     {t:court(0), s:'vainqueur', cls:'va', f:()=>valider('A')},
     {t:'Nul', cls:'ghost mini', f:()=>valider('nul')},
     {t:court(1), s:'vainqueur', cls:'vb', f:()=>valider('B')}]);
  surJeton(id=>{
    const i=S.surv.indexOf(id);
    if(i>=0) S.surv.splice(i,1); else S.surv.push(id);
    rendre();
  });
}

function completer(){
  ['A','B'].forEach(e=>{
    const b = banc(e).sort((x,y)=>(S.joues[x]||0)-(S.joues[y]||0) || nom(x).localeCompare(nom(y)));
    const manque = S.terrain - surTerrain(e).length;
    if(manque > 0) b.slice(0, manque).forEach(id=> S.field[id]=e);
  });
  rendre();
}

function valider(v){
  const compo = {...S.field};
  S.assauts.push({n:S.assauts.length+1, v, compo, surv:[...(S.surv||[])],
                  t:new Date().toISOString()});
  Object.keys(compo).forEach(id=> S.joues[id]=(S.joues[id]||0)+1);
  S.field = {};
  (S.surv||[]).forEach(id=> S.field[id]=compo[id]);
  S.surv = [];
  S.enCours = false;
  rendre();
}

$('#undo').onclick = ()=>{
  if(S.phase==='bilan'){ S.phase='combat'; return rendre(); }
  const a = S.assauts.pop();
  if(!a) return;
  Object.keys(a.compo).forEach(id=> S.joues[id]=Math.max(0,(S.joues[id]||1)-1));
  const av = S.assauts[S.assauts.length-1];
  S.field = {}; S.surv = []; S.enCours = false;
  if(av) av.surv.forEach(id=> S.field[id]=av.compo[id]);
  rendre();
};

/* ------------------------------------------------ 5. bilan */
function stats(id){
  let a=0,v=0,s=0;
  S.assauts.forEach(x=>{ if(id in x.compo){ a++; if(x.v===x.compo[id]) v++; if(x.surv.includes(id)) s++; } });
  return {a,v,s};
}
function vBilan(){
  const lignes = S.presents.map(id=>({id,nom:nom(id),e:S.eq[id],p:S.prix[id],...stats(id)}))
    .sort((x,y)=> (x.e||'').localeCompare(y.e||'') || y.v-x.v);
  const rqp = lignes.filter(l=>l.p>0).map(l=>({...l,r:l.v/l.p})).sort((x,y)=>y.r-x.r).slice(0,3);
  vue(`<h2>Bilan de la séance</h2>
    <p class="hint">${S.assauts.length} assauts · ${S.presents.length} présents</p>
    ${rqp.length?`<h3 style="margin:12px 0 6px">Meilleur rapport qualité-prix</h3>
      <table>${rqp.map(l=>`<tr><td>${l.nom}</td><td class="n">${l.v} vict.</td>
        <td class="n">${l.p} p.</td><td class="n">${l.r.toFixed(3)}</td></tr>`).join('')}</table>`:''}
    <h3 style="margin:16px 0 6px">Tout le monde</h3>
    <table><tr><th>Nom</th><th class="n">Ass.</th><th class="n">Vict.</th><th class="n">Surv.</th><th class="n">Prix</th></tr>
    ${lignes.map(l=>`<tr><td style="color:var(--${l.e==='A'?'a':'b'})">${l.nom}</td>
      <td class="n">${l.a}</td><td class="n">${l.v}</td><td class="n">${l.s}</td>
      <td class="n">${l.p||'—'}</td></tr>`).join('')}</table>`,
    [{t:'Reprendre', cls:'ghost', f:()=>{S.phase='combat';rendre();}},
     {t:'Exporter', s:'fichier .json', cls:'go', f:exporter},
     {t:'Copier', cls:'ghost', f:copier}]);
}
function paquet(){
  return JSON.stringify({version:1, debut:S.debut, fin:new Date().toISOString(),
    terrain:S.terrain, budget:S.budget,
    roster:S.roster, presents:S.presents, capitaines:S.cap, protege:S.protege, vivier:S.vivier,
    equipes:S.eq, roles:S.role, prix:S.prix, loadouts:S.load,
    assauts:S.assauts}, null, 1);
}
async function exporter(){
  const nomF = 'seance-'+new Date().toISOString().slice(0,10)+'.json';
  const txt = paquet();
  // iOS : la feuille de partage (AirDrop, Mail, Fichiers) marche même en mode
  // plein écran, contrairement au téléchargement classique.
  try{
    const f = new File([txt], nomF, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:nomF});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  try{
    const b = new Blob([txt], {type:'application/json'});
    const u = URL.createObjectURL(b), a = document.createElement('a');
    a.href=u; a.download=nomF; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 2000);
  }catch(e){ copier(); }
}
async function copier(){
  try{ await navigator.clipboard.writeText(paquet()); alert('Copié. Colle-le dans un mail ou une note.'); }
  catch(e){
    const t=document.createElement('textarea'); t.value=paquet();
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
    alert('Copié.');
  }
}

/* ------------------------------------------------ accès bilan depuis le combat */
document.addEventListener('keydown', e=>{ if(e.key==='b' && S.phase==='combat'){ S.phase='bilan'; rendre(); }});
$('#tour').onclick = ()=>{
  if(S.phase==='combat'){ S.phase='bilan'; rendre(); }
  else if(S.phase==='bilan'){ S.phase='combat'; rendre(); }
};

rendre();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
